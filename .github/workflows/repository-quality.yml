name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check public boundary
        run: python tools/check_public_boundary.py --repo-root .

      - name: Check repository JSON and Markdown
        run: python tools/check_repository_integrity.py --repo-root .

      - name: Run Python tests
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/*.sh
