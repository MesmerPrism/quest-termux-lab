name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check public boundary
        run: python tools/check_public_boundary.py --repo-root .

      - name: Check repository JSON and Markdown
        run: python tools/check_repository_integrity.py --repo-root .

      - name: Run Python tests
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/*.sh

  spatial-desktop-android:
    name: Spatial Desktop Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          gradle-version: "9.4.1"

      - name: Test, lint, and assemble
        run: gradle -p examples/spatial-desktop-panel test lint assembleDebug assembleRelease

  spatial-codex-workbench:
    name: Spatial Codex Workbench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          gradle-version: "9.4.1"

      - name: Test sidecar and shell source
        run: |
          node --test examples/spatial-codex-workbench/sidecar/tests/*.test.mjs
          bash -n examples/spatial-codex-workbench/demo-project/build.sh

      - name: Test, lint, and assemble
        run: gradle -p examples/spatial-codex-workbench test lint assembleDebug assembleRelease assembleAndroidTest
